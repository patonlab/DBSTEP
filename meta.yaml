{% set name = "dbstep" %}
{% set version = "2.1.0" %}
# NOTE: Update version above to match dbstep/__version__ on each release.
# The sha256 hash must also be updated from the PyPI sdist.

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: d0677993a41b425e2aa36196f12c2e7a8597167294e4ddf8854bc6b4131c3ca4

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python >=3.10
    - setuptools >=64
  run:
    - cclib
    - numpy
    - python >=3.10
    - scipy

test:
  imports:
    - dbstep

about:
  home: "https://github.com/patonlab/DBSTEP"
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: "DFT-Based Steric Parameters"

extra:
  recipe-maintainers:
    - luchini18
